# Pre-commit hooks configuration
# See https://pre-commit.com for more information

repos:
  # Verificar arquivos YAML
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
      - id: end-of-file-fixer
        name: Fix End of Files
      - id: check-yaml
        name: Check YAML
      - id: check-added-large-files
        name: Check for large files
        args: [--maxkb=1000]
      - id: check-json
        name: Check JSON
      - id: check-toml
        name: Check TOML
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: debug-statements
        name: Check for debugger imports

  # Hooks locais usando poetry (mesma versão do projeto)
  - repo: local
    hooks:
      # Ruff linter
      - id: ruff
        name: ruff (linter)
        entry: poetry run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]

      # Ruff formatter
      - id: ruff-format
        name: ruff (formatter)
        entry: poetry run ruff format
        language: system
        types_or: [python, pyi]

      # Testes unitários (rápidos, sem integração)
      - id: pytest-unit
        name: pytest (unit tests)
        entry: poetry run pytest tests/unit -x -q --no-cov
        language: system
        pass_filenames: false
        always_run: true
