[project]
name = "otel-observability"
version = "0.0.12.dev0"
description = "OpenTelemetry wrapper for FastAPI and AWS Lambda with Datadog"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation>=0.41b0",
]

[project.optional-dependencies]
fastapi = [
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "fastapi>=0.100.0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-requests>=0.41b0",
]
lambda = [
    "opentelemetry-propagator-aws-xray>=1.0.0",
    "opentelemetry-instrumentation-boto3sqs>=0.41b0",
    "opentelemetry-instrumentation-botocore>=0.41b0",
]
database = [
    "opentelemetry-instrumentation-sqlalchemy>=0.41b0",
    "opentelemetry-instrumentation-psycopg2>=0.41b0",
    "opentelemetry-instrumentation-pymongo>=0.41b0",
]
redis = [
    "opentelemetry-instrumentation-redis>=0.41b0",
]
http = [
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-requests>=0.41b0",
]
chalice = [
    "chalice>=1.0.0",
]
metrics = [
    "datadog>=0.45.0",
]
all = [
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "fastapi>=0.100.0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-requests>=0.41b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.41b0",
    "opentelemetry-instrumentation-psycopg2>=0.41b0",
    "opentelemetry-instrumentation-pymongo>=0.41b0",
    "opentelemetry-instrumentation-redis>=0.41b0",
    "opentelemetry-instrumentation-boto3sqs>=0.41b0",
    "opentelemetry-instrumentation-botocore>=0.41b0",
    "opentelemetry-propagator-aws-xray>=1.0.0",
    "chalice>=1.0.0",
    "datadog>=0.45.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
    "httpx>=0.23,<0.28",
    "fastapi>=0.100.0",
]

# Ruff Configuration
[tool.ruff]
# Linha de comprimento máxima
line-length = 100
# Diretórios a serem ignorados
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".eggs",
    "*.egg",
    "dist",
    "build",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "ARG001", # unused function argument
    "ARG002", # unused method argument
]
fixable = ["ALL"]
unfixable = []

# Configuração de formatação
[tool.ruff.format]
# Usar aspas duplas
quote-style = "double"
# Indentação com espaços
indent-style = "space"
# Tamanho da indentação
skip-magic-trailing-comma = false
# Linha de comprimento máxima
line-ending = "auto"

# Configuração de importação (isort)
[tool.ruff.lint.isort]
known-first-party = ["otel_observability"]
force-sort-within-sections = true
split-on-trailing-comma = true

# Configuração específica para arquivos
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports em __init__.py são permitidos
"tests/**/*.py" = ["ARG", "S101"]  # permitir argumentos não usados e assert em testes
"examples/**/*.py" = ["T201"]  # permitir print em exemplos

# Pytest Configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=otel_observability",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
